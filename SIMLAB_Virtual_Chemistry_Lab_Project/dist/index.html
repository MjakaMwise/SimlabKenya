function studyLabMission(){let task=studyState.labTask;if(!task||task.returned)return '';let q=studyBank.find(x=>x.id===task.qid);if(!q)return '';return `<section class="study-lab-banner"><div><span class="eyebrow">STUDY LAB MISSION</span><h2>${esc(q.prompt)}</h2><p>${esc(q.lab?.prompt||'Complete the linked practical and return to Study to report what you observed.')}</p></div>${'<button class="btn soft small" data-study-return '+(studyState.lastBenchRun?'':'disabled')+'>Return to Study &amp; report&nbsp; →</button>'}</section>`}
function studyLabReport(q){let task=studyState.labTask;if(!task||task.qid!==q.id||!task.returned||!q.lab)return '';let run=studyState.lastBenchRun,ready=false,seen='No lab run found yet.';if(q.lab.kind==='bench'&&run?.kind==='bench'){ready=q.lab.reagents.every(x=>run.reagents.includes(x));seen=`Bench reagents: ${run.reagents.join(' + ')||'none'}. Result: ${run.precipitate?'precipitate observed':'no precipitate predicted'}.`}if(q.lab.kind==='qual'&&run?.kind==='qual'){ready=run.test==='oxygen';seen=`Qualitative test: ${run.test}. Observation: ${run.observation}.`}return `<section class="study-lab-report"><div class="eyebrow">LAB REPORT FOR MARKING</div><h3>${ready?'Record the evidence from your experiment':'I could not verify the required lab run'}</h3><p>${esc(seen)} ${ready?'Choose the observation that matches your run.':'Return to the lab, carry out the named practical, then come back to report it.'}</p>${ready?`<div class="study-choice-list">${q.lab.options.map((x,i)=>`<button type="button" class="study-choice ${studyState.labReportAnswer===q.lab.values[i]?'selected':''}" data-study-lab-choice="${i}"><span>${String.fromCharCode(65+i)}</span>${esc(x)}</button>`).join('')}</div><button type="button" class="btn small" data-study-mark-lab>Submit lab report</button>${studyState.labFeedback?`<div class="study-feedback ${studyState.labFeedback.correct?'correct':'incorrect'}"><b>${studyState.labFeedback.correct?'Lab report marked · +5 XP':'Try again'}</b><p>${esc(studyState.labFeedback.message)}</p></div>`:''}`:`<button type="button" class="btn secondary small" data-study-retry-lab>Return to the linked lab</button>`}</section>`}
function studyPage(){let q=studyQuestion(),list=studyQuestionList(),unit=studyUnits.find(x=>x.id===studyState.topic)||studyUnits[0],idx=Number(studyState.indices?.[studyState.topic])||0,answered=!!studyState.feedback,choiceHtml=q.type==='choice'?`<div class="study-choice-list">${q.options.map((x,i)=>`<button type="button" class="study-choice ${studyState.answer===x?'selected':''}" data-study-choice="${i}"><span>${String.fromCharCode(65+i)}</span>${esc(x)}</button>`).join('')}</div>`:q.type==='balance'?`<label class="study-answer-label">COEFFICIENTS FROM LEFT TO RIGHT<input id="studyAnswer" type="text" value="${esc(studyState.answer)}" placeholder="For example: 4, 3, 2" autocomplete="off"></label>`:q.type==='numeric'?`<label class="study-answer-label">YOUR ANSWER${q.unit?` (${esc(q.unit)})`:''}<input id="studyAnswer" type="number" step="any" value="${esc(studyState.answer)}" placeholder="Enter a number"></label>`:q.type==='titration'?studyState.titrationSubmission?`<div class="study-titre-export"><b>Lab titres received</b><div>${studyState.titrationSubmission.readings.map((x,i)=>`<span>Run ${i+1}: <strong>${ttFmt(x)} mL</strong></span>`).join('')}</div><p>Mean titre: <strong>${studyState.titrationSubmission.mean.toFixed(2)} mL</strong> · Standard: ${studyState.titrationSubmission.titrantC.toFixed(4)} mol/L · Unknown aliquot: ${studyState.titrationSubmission.sampleVol.toFixed(2)} mL</p></div><label class="study-answer-label">MOLES OF UNKNOWN IN THE ALIQUOT (mol)<input id="studyAnswer" type="number" step="any" value="${esc(studyState.answer)}" placeholder="Calculate and enter moles"></label>`:`<div class="study-titre-export"><b>Titration practical</b><p>Prepare the 25.00 mL unknown acid aliquot, titrate with 0.1000 mol/L NaOH, record at least two titres, and send the readings back here.</p><button type="button" class="btn" data-study-start-titration>Start titration challenge&nbsp; →</button></div>`:'';let lab=q.lab?`<section class="study-practical"><div><span class="eyebrow">TRY IT IN THE LAB</span><h3>${esc(q.lab.kind==='qual'?'Run the qualitative test':'Take this question to the Open Bench')}</h3><p>${esc(q.lab.prompt)}</p></div><button type="button" class="btn soft small" data-study-start-lab>Start lab challenge&nbsp; →</button></section>`:'';let feedback=studyState.feedback?`<div class="study-feedback ${studyState.feedback.correct?'correct':'incorrect'}"><b>${studyState.feedback.correct?'Correct · +10 XP':'Not quite yet'}</b><p>${esc(studyState.feedback.message)}</p><div class="study-explanation"><b>Why</b><p>${esc(q.explanation)}</p></div></div>`:'';let mission=studyLabReport(q),titrationAction=q.type==='titration'&&!studyState.titrationSubmission?`<button type="button" class="btn" data-study-start-titration>Start titration challenge&nbsp; →</button>`:'';return `${head('STUDY STUDIO','Learn chemistry by solving and testing','Choose a topic, work through a short question, then take selected challenges into the virtual lab for evidence-based marking.')}<div class="study-progress-card"><div class="study-progress-icon">✦</div><div class="study-progress-copy"><b>${studyState.xp} XP · ${studyState.streak} correct in a row</b><span>${studyCompletedCount()} of ${studyBank.length} questions completed</span><div class="study-progress-track"><i style="width:${studyProgress()}%"></i></div></div><div class="study-rank">${studyState.xp>=80?'Lab Scholar':studyState.xp>=30?'Reaction Ranger':'Chem Explorer'}</div></div><div class="study-unit-grid">${studyUnits.map(u=>`<button type="button" class="study-unit ${u.id===unit.id?'active':''}" data-study-topic="${u.id}"><span>${u.icon}</span><b>${esc(u.title)}</b><small>${esc(u.desc)}</small></button>`).join('')}</div><div class="study-workspace"><section class="study-question-card"><div class="study-question-meta"><span>${unit.icon} ${esc(unit.title)}</span><span>Question ${idx+1} of ${list.length} · ${studyBank.length} in the study bank</span></div><h2>${esc(q.prompt)}</h2>${q.type==='titration'?`<p class="study-question-note">The titration app will pass your recorded titres back here; you will calculate the unknown amount yourself.</p>`:''}${choiceHtml}${studyState.hintShown?`<div class="study-hint"><b>Hint</b><p>${esc(q.hint)}</p></div>`:''}${feedback}${!answered&&q.type!=='titration'?`<button type="button" class="btn" data-study-check>Check my answer</button>`:''}${q.type==='titration'&&studyState.titrationSubmission&&!answered?`<button type="button" class="btn" data-study-check>Check my calculation</button>`:''}<button type="button" class="btn secondary small" data-study-hint>${studyState.hintShown?'Hide hint':'Show a hint'}</button><button type="button" class="btn secondary small" data-study-next>Next question&nbsp; →</button>${lab}${mission}</section><aside class="study-side-card"><div class="eyebrow">YOUR LEARNING PATH</div><h3>Build it step by step</h3><ol><li>Understand atoms, ions and formulae.</li><li>Balance equations and predict products.</li><li>Use moles, concentrations and ratios.</li><li>Choose apparatus and measure accurately.</li><li>Test ideas through reactions and titration.</li><li>Extend to redox, physical and organic chemistry.</li></ol><div class="study-side-note">Questions are designed to connect calculations with observations in SIMLAB’s lab modules.</div></aside></div>`}
function studySetTopic(topic){if(!studyUnits.some(x=>x.id===topic))return;if(topic!==studyState.topic){studyState.labTask=null;studyState.lastBenchRun=null;studyState.labReportAnswer='';studyState.labFeedback=null}studyState.topic=topic;studyState.answer='';studyState.feedback=null;studyState.hintShown=false;studyState.labFeedback=null;studyState.labReportAnswer='';saveStudy();render()}
function studyCheckAnswer(){let q=studyQuestion(),answer=String(studyState.answer||'').trim(),expected=q.answer,correct=false;if(q.type==='choice')correct=answer===expected;else if(q.type==='balance'){let got=answer.split(/[^0-9.]+/).filter(Boolean).map(Number),want=String(expected).split(',').map(Number);correct=got.length===want.length&&got.every((x,i)=>x===want[i])}else if(q.type==='numeric')correct=answer!==''&&Number.isFinite(Number(answer))&&Math.abs(Number(answer)-expected)<=Math.max(Math.abs(expected)*(q.tolerance||.01),1e-8);else if(q.type==='titration'&&studyState.titrationSubmission){let d=studyState.titrationSubmission,expectedMoles=d.titrantC*d.mean/1000*d.analyteCoeff/d.titrantCoeff;correct=answer!==''&&Number.isFinite(Number(answer))&&Math.abs(Number(answer)-expectedMoles)<=Math.max(expectedMoles*.02,1e-8)}if(q.type==='titration'&&!studyState.titrationSubmission)return;let message=correct?(q.type==='titration'?studyTitrationExplanation():q.explanation):'Review the hint, check your units or coefficients, and try again.';studyState.feedback={correct,message};if(correct){studyState.streak++;if(!studyState.completed.includes(q.id)){studyState.completed.push(q.id);studyState.xp+=10}}else studyState.streak=0;saveStudy();render()}
function studyTitrationExplanation(){let d=studyState.titrationSubmission,nKnown=d.titrantC*d.mean/1000,nUnknown=nKnown*d.analyteCoeff/d.titrantCoeff;return `Mean titre = ${d.mean.toFixed(2)} mL = ${(d.mean/1000).toFixed(5)} L. Moles NaOH = C × V = ${d.titrantC.toFixed(4)} × ${(d.mean/1000).toFixed(5)} = ${nKnown.toPrecision(4)} mol. HCl : NaOH ratio = ${d.analyteCoeff} : ${d.titrantCoeff}; moles of HCl = ${nKnown.toPrecision(4)} × ${d.analyteCoeff}/${d.titrantCoeff} = ${nUnknown.toPrecision(4)} mol.`}
function studyStartLab(){let q=studyQuestion();if(!q.lab)return;studyState.labTask={qid:q.id,returned:false};studyState.lastBenchRun=null;studyState.labReportAnswer='';studyState.labFeedback=null;saveStudy();if(q.lab.kind==='qual'){selectedQualTab='gases';selectedTest='oxygen';go('qual')}else go('bench')}
function studyStartTitration(){studyState.topic='titration';studyState.titrationSubmission=null;studyState.titrationChallenge=true;studyState.answer='';studyState.feedback=null;titration=freshTitration('acid');titration.unknownSpecies='HCl';titration.knownChemical='Sodium hydroxide';titration.analyteConc='';titration.titrantC=.1;titration.sampleVol=25;titration.analyteCoeff=1;titration.titrantCoeff=1;titration.reactionEquation='HCl + NaOH → NaCl + H₂O';titration.expected=24.6;saveStudy();go('titration')}
function studyReturnFromLab(){if(studyState.labTask)studyState.labTask.returned=true;studyState.topic=studyBank.find(q=>q.id===studyState.labTask?.qid)?.topic||studyState.topic;studyState.answer='';studyState.feedback=null;saveStudy();go('study')}
function studyMarkLab(){let q=studyQuestion(),run=studyState.lastBenchRun,valid=false,selected=studyState.labReportAnswer;if(q.lab?.kind==='bench'&&run?.kind==='bench')valid=q.lab.reagents.every(x=>run.reagents.includes(x));if(q.lab?.kind==='qual'&&run?.kind==='qual')valid=run.test==='oxygen';let correct=valid&&selected===q.lab?.answer&&((q.lab.kind!=='bench')||run.precipitate)&&((q.lab.kind!=='qual')||run.positive);studyState.labFeedback={correct,message:correct?'Your report matches the recorded lab observation.':valid?'That report does not match the observation from your run. Review the result and try again.':'The required reagent pair or qualitative test is not in the recorded run.'};if(correct){let id=`lab-${q.id}`;if(!studyState.completed.includes(id)){studyState.completed.push(id);studyState.xp+=5}studyState.streak++}saveStudy();render()}
function studyExportTitres(){let readings=(titration.titreReadings||[]).slice();if(readings.length<2)return;let mean=readings.reduce((a,b)=>a+b,0)/readings.length;studyState.titrationSubmission={readings,mean,titrantC:Number(titration.titrantC)||.1,sampleVol:Number(titration.sampleVol)||25,analyteCoeff:Number(titration.analyteCoeff)||1,titrantCoeff:Number(titration.titrantCoeff)||1,unknown:titration.unknownSpecies,equation:titration.reactionEquation};studyState.titrationChallenge=false;studyState.topic='titration';studyState.answer='';studyState.feedback=null;studyState.indices.titration=0;saveStudy();go('study')}

function home(){return `${head('WELCOME TO YOUR DIGITAL LAB','Explore chemistry by doing.','Choose an experiment, handle virtual apparatus, mix reagents and follow the evidence. Your work is automatically saved on this device so you can return later.')}<section class="hero"><div class="hero-main"><div><div class="eyebrow" style="color:#b9e985">PICK UP WHERE YOU LEFT OFF</div><h2>Reactions, measurements, discovery.</h2><p>Build confidence with guided experiments and an open bench for trying combinations safely in simulation.</p></div><button class="btn" data-resume-session>${workspaceHasSaved?`Continue ${esc(({study:'Study',bench:'Open bench',qual:'Qualitative tests',titration:'Titrations',water:'Water analysis',electrochem:'Electrochemistry',physchem:'Physical chemistry',gravimetric:'Gravimetric analysis',chromatography:'Chromatography',instrumentation:'Instrumentation · GC',massspec:'MS data analysis',uvvis:'UV–Visible',analysislibrary:'Analytical library',ftir:'FTIR spectroscopy'}[lastNonHomePage]||'laboratory'))}`:'Enter the laboratory'}&nbsp; →</button></div><div class="hero-art"><div class="beaker"><i class="bubble"></i></div><div class="artlabel">OBSERVE<br>MEASURE<br>UNDERSTAND</div></div></section><div class="statrow"><div class="panel stat"><div class="stathead">Experiments completed <span class="statbadge">THIS SESSION</span></div><div class="statnum">${log.length}<span> / 12</span></div></div><div class="panel stat"><div class="stathead">Titration modules <span class="statbadge">READY</span></div><div class="statnum">04<span> methods</span></div></div><div class="panel stat"><div class="stathead">Qualitative tests <span class="statbadge">READY</span></div><div class="statnum">09<span> species</span></div></div></div><div class="sectionhead"><h2>Choose a laboratory area</h2><a href="#" data-go="bench">Browse modules →</a></div><div class="grid module-grid"><div class="panel module" data-go="uvvis"><span class="arr">↗</span><div class="module-icon">☀</div><h3>UV–Visible spectroscopy</h3><p>Blank the spectrophotometer, scan spectra and quantify unknowns using measured standards.</p></div><div class="panel module" data-go="instrumentation"><span class="arr">↗</span><div class="module-icon">⌁</div><h3>Instrumentation · GC</h3><p>Operate a gas chromatograph, develop a method and measure live chromatographic peaks.</p></div><div class="panel module" data-go="chromatography"><span class="arr">↗</span><div class="module-icon">▥</div><h3>Chromatography</h3><p>Spot mixtures, develop TLC plates and identify unknowns with standards.</p></div><div class="panel module" data-go="study"><span class="arr">↗</span><div class="module-icon">✦</div><h3>Study &amp; practice</h3><p>Learn core chemistry, answer questions, and take challenges into the lab.</p></div><div class="panel module" data-go="bench"><span class="arr">↗</span><div class="module-icon">⚗</div><h3>Open reaction bench</h3><p>Select apparatus and reagents, mix and inspect simulated changes.</p></div><div class="panel module" data-go="qual"><span class="arr">↗</span><div class="module-icon">◉</div><h3>Qualitative analysis</h3><p>Investigate gases and common ions through characteristic tests.</p></div><div class="panel module" data-go="titration"><span class="arr">↗</span><div class="module-icon">◌</div><h3>Titration techniques</h3><p>Acid–base, redox, iodometric and complexometric methods.</p></div><div class="panel module" data-go="water"><span class="arr">↗</span><div class="module-icon">≋</div><h3>Water hardness</h3><p>Determine total hardness by EDTA and interpret your result.</p></div><div class="panel module" data-go="electrochem"><span class="arr">↗</span><div class="module-icon">ϟ</div><h3>Electrochemistry</h3><p>Build galvanic cells, plate metals and explore zinc protection.</p></div><div class="panel module" data-go="physchem"><span class="arr">↗</span><div class="module-icon">∿</div><h3>Physical chemistry</h3><p>Explore kinetics, gas laws and Gibbs free energy.</p></div></div><div class="sectionhead" id="recent"><h2>Session notebook</h2><a href="#" data-action="clear-log">Clear session</a></div><div class="panel notebook">${log.length?`<table class="table"><thead><tr><th>TIME</th><th>EXPERIMENT</th><th>OBSERVATION / RESULT</th></tr></thead><tbody>${log.slice().reverse().slice(0,5).map(x=>`<tr><td>${x.time}</td><td>${esc(x.title)}</td><td>${esc(x.result)}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">Your observations and completed experiments will appear here.</p>`}</div><p class="footer-note">This is a learning simulation. Colours, volumes and outcomes are modeled for teaching; they are not experimental measurements or a substitute for supervised laboratory work.</p>`}
function bench(){if(gcBenchTab==='gc')return `${head('INTERACTIVE WORKSPACE','Open bench','Prepare samples and standards, then transfer labelled vials to the GC-FID.')}${gcBenchTabs()}${gcPreparationPanel()}`;return `${head('INTERACTIVE WORKSPACE','Open reaction bench','Move apparatus, measure liquid transfers, and investigate gases with animated virtual tools.')}${gcBenchTabs()}${studyLabMission()}<p class="muted">Chemistry model: supported dilute aqueous reactions near 25 °C. Colours are illustrative; unsupported mixtures are labelled rather than guessed. <a href="bench-chemistry-reference.txt" target="_blank" rel="noopener">Reaction coverage &amp; scientific references</a></p><div class="panel simbench"><div class="simbench-head"><div><h2>Hands-on workbench</h2><p class="sub" style="margin:4px 0 0">Arrange apparatus on the 2D bench, select a vessel to add or manage measured substances, and use the controls to explore reactions, gas tests, heating, and liquid extraction.</p><a class="bench-help-toggle" href="apparatus-preview.html" target="_blank" rel="noopener">Apparatus style gallery ↗</a> <button type="button" class="bench-help-toggle" data-toggle-bench-help aria-expanded="false">View more</button><div class="bench-help-more" data-bench-help-more hidden><p>Use the Transfer drawer for indicator droppers, calibrated and graduated pipettes, weighed-solid spatulas, wash bottles, and funnel-assisted transfers. Select a tool to open its working controls. Select apparatus to view its contents and role. Add reagents only to compatible vessels or solid-sample surfaces: gas jars are for gas samples, funnels guide transfers, and wash bottles hold distilled water only. Double-click a filled vessel to activate pour mode, select a receiver, set the volume, and pour. Select the wooden splint or indicator paper to open its controls. Use the Apparatus panel to group pieces, then move or rotate them together.</p><p>For liquid extraction, combine an aqueous sample with an immiscible organic solvent in a compatible vessel and transfer the mixture into the separating funnel. Mix and observe liquids in a vessel to compare miscible and immiscible pairs. In the separating funnel, close the stopcock, mix, let layers settle, choose a receiver, and transfer each layer separately. Ethanol and acetone mix with water; hexane, ethyl acetate, and dichloromethane form a second layer.</p><p>For distillation, add liquid to the round-bottom flask, heat it, collect condensate in the receiver, then test it with indicator paper. Drag apparatus to move it, use the rotate and zoom controls, or pinch on touch screens. Expand the bench to full screen when needed.</p></div></div><div class="bench-toolbar"><select id="setupPreset" aria-label="Choose a setup"><option value="distillation">Simple distillation</option><option value="reflux">Reflux</option><option value="soxhlet">Soxhlet extraction</option></select><button class="btn soft small" id="loadSetup" title="Loads the selected layout and replaces the current bench arrangement">Load setup</button><small class="setup-note">replaces current layout</small><label class="bench-background-control" for="benchBackground">Bench background<select id="benchBackground"><option value="original">Original</option><option value="dark">Dark</option></select></label><button class="btn secondary small" id="maximizeBench" title="Maximize the working screen">⛶ Maximize</button><button class="btn secondary small" id="restoreBench" title="Restore the working screen" hidden>↙ Restore</button><button class="btn secondary small" id="rotateLeft" title="Rotate selected apparatus counterclockwise">↶ 15°</button><button class="btn secondary small" id="rotateRight" title="Rotate selected apparatus clockwise">↷ 15°</button><button class="btn secondary small" id="removeSelected" title="Remove the selected apparatus from the workbench">Remove selected</button><button class="btn secondary small" id="clearBench">Clear bench</button></div></div><div class="simbench-grid"><div class="apparatus-shelf"><div class="shelf-title">APPARATUS DRAWER</div><div class="eq-tabs">${['Glassware','Measurement','Heating','Distillation','Extraction','Support','Transfer','Other'].map(c=>`<button class="eq-tab ${c===equipmentCategory?'active':''}" data-eqfilter="${c}">${c}</button>`).join('')}</div><div class="shelf-items" id="shelfItems">${equipment.filter(x=>x[4]===equipmentCategory||(equipmentCategory==='Transfer'&&['dropper','volumetricPipette','graduatedPipette'].includes(x[0]))).map(x=>`<button class="shelf-item" draggable="true" data-new="${x[0]}" title="Drag to bench or tap to add"><span class="eq">${transferShelfIcon(x)}</span><small>${x[1]}</small></button>`).join('')}</div><div class="notice" style="margin-top:10px">Tilt a filled vessel above 114° to pour all its contents into the selected destination, or drag its outlet toward a receiver for a measured pour. Mix staged reagents in their vessel or transfer them to a receiver. Starting heat on a staged mixture or adding reagent during heating also mixes the contents. For hydrogen, turn the gas jar upside down (opening down); leave it upright for carbon dioxide. Place it by the gas outlet and watch the collection response.</div></div><div class="bench-canvas" id="benchCanvas"><div class="bench-empty ${apparatus.length?'hidden':''}">Workbench clear. Tap or drag an item from the apparatus drawer to place it here.<br>Only add the equipment needed for your setup.</div>${benchItems()}${demoEffects()}${apparatusPopupHtml()}</div></div><div class="bench-selection-summary"><div class="measure-label" id="measureStatus">${selectedEquipmentLabel()}</div><div class="vessel-mixture" id="vesselMixture">${vesselMixtureHtml(selectedEquipment())}</div><div class="gas-status bench-action-status" id="gasStatus" aria-live="polite">Select an apparatus and choose a task. Results and transfer messages appear here.</div></div><div class="sim-controls"><div class="bench-taskbar" id="benchTaskbar let physicalState={mode:'kinetics',order:1,kTemp:298,kEa:50,kC0:1,kRef:.02,catalyst:false,progress:0,gasLaw:'boyle',gVolume:5,gTemp:298,gMoles:1,gPressure:101.3,gibbsH:-40,gibbsS:-100,gibbsT:298};
function pcKineticsData(){let {order,kTemp,kEa,kC0,kRef,catalyst,progress}=physicalState,R=8.314462618,Ea=Math.max(0,kEa-(catalyst?15:0))*1000,T=Math.max(1,kTemp),k=kRef*Math.exp(-Ea/R*(1/T-1/298.15)),tHalf=order===0?kC0/(2*k):order===1?Math.LN2/k:1/(k*kC0),tMax=order===0?.9*kC0/k:order===1?4.5/k:5/(k*kC0);tMax=Math.max(10,Math.min(10000,tMax));let time=tMax*progress/100,conc=t=>order===0?Math.max(0,kC0-k*t):order===1?kC0*Math.exp(-k*t):kC0/(1+k*kC0*t),current=conc(time),rate=k*Math.pow(current,order);return {order,kTemp,kEa,Ea:Ea/1000,kC0,kRef,catalyst,k,tHalf,tMax,time,current,rate,conc}}

function pcKineticsControls(){let units=['M s⁻¹','s⁻¹','M⁻¹ s⁻¹'][physicalState.order];return `<div class="pc-control-grid"><label>Reaction order<select data-pc-field="order"><option value="0" ${physicalState.order===0?'selected':''}>Zero order</option><option value="1" ${physicalState.order===1?'selected':''}>First order</option><option value="2" ${physicalState.order===2?'selected':''}>Second order</option></select></label><label>Initial concentration, [A]₀ (M)<input data-pc-field="kC0" type="number" min="0.05" max="5" step="0.05" value="${physicalState.kC0}"></label><label>Temperature (K)<input data-pc-field="kTemp" type="number" min="250" max="1000" step="1" value="${physicalState.kTemp}"></label><label>Activation energy, Eₐ (kJ mol⁻¹)<input data-pc-field="kEa" type="number" min="0" max="200" step="1" value="${physicalState.kEa}"></label><label>Rate constant at 298.15 K<input data-pc-field="kRef" type="number" min="0.000001" max="10" step="0.001" value="${physicalState.kRef}"><small>k₂₉₈ units: ${units}</small></label><label class="pc-check-label"><input data-pc-field="catalyst" type="checkbox" ${physicalState.catalyst?'checked':''}><span>Add catalyst</span><small>Model lowers Eₐ by 15 kJ mol⁻¹; it does not change ΔG.</small></label></div>`}
function pcKineticsView(){let d=pcKineticsData(),unit=['M s⁻¹','s⁻¹','M⁻¹ s⁻¹'][d.order],law=['rate = k','rate = k[A]','rate = k[A]²'][d.order],linear=['[A]ₜ = [A]₀ − kt','ln[A]ₜ = ln[A]₀ − kt','1/[A]ₜ = 1/[A]₀ + kt'][d.order],graphTitle=['Zero-order plot · [A] vs time','First-order plot · ln[A] vs time','Second-order plot · 1/[A] vs time'][d.order],half=`${d.tHalf.toFixed(2)} s`;return `<div class="pc-kinetics-stage"><div class="pc-molecule-vessel ${physicalState.catalyst?'catalysed':''}"><div class="pc-vessel-head">REACTION PROGRESS</div><div class="pc-particles">${Array.from({length:10},(_,i)=>`<i class="${i/10<physicalState.progress/100?'product-particle':'reactant-particle'}" style="--i:${i}">${i/10<physicalState.progress/100?'B':'A'}</i>`).join('')}</div><div class="pc-progress-caption">${(100*d.current/d.kC0).toFixed(1)}% A remains · ${(100*(1-d.current/d.kC0)).toFixed(1)}% converted</div></div><div class="pc-kinetics-chart-card"><div class="pc-chart-title"><b>${graphTitle}</b><small>Linear integrated-rate-law plot</small></div>${pcKineticsChart()}<label class="pc-progress-control">REACTION TIME <input data-pc-field="progress" type="range" min="0" max="100" step="1" value="${physicalState.progress}"><output>${d.time.toFixed(1)} s / ${d.tMax.toFixed(0)} s</output></label></div></div><div class="pc-equation-strip"><small>RATE LAW</small><b>${law}</b><small>LINEAR INTEGRATED PLOT</small><b>${linear}</b><small>Temperature dependence</small><b>k(T) = k₂₉₈ exp[−Eₐ/R (1/T − 1/298.15)]</b></div><div class="pc-reading-grid"><div><small>k at ${d.kTemp} K</small><b>${d.k.toPrecision(4)} ${unit}</b></div><div><small>Instantaneous rate</small><b>${d.rate.toPrecision(4)} M s⁻¹</b></div><div><small>Half-life</small><b>${half}</b></div></div><p class="pc-explain">Each selected order has a different integrated-rate-law plot. The selected linearized graph is straight when the chosen order matches the modeled reaction.</p>`}
function pcGasData(){let law=physicalState.gasLaw,R=8.314462618,T=physicalState.gTemp,n=physicalState.gMoles,V=physicalState.gVolume,P=physicalState.gPressure,formula='PV = nRT',constant='';if(law==='boyle'){T=298.15;n=1;P=n*R*T/V;formula='P₁V₁ = P₂V₂';constant='Temperature and amount fixed'}if(law==='charles'){P=101.325;n=1;V=n*R*T/P;formula='V₁/T₁ = V₂/T₂';constant='Pressure and amount fixed'}if(law==='gay'){V=10;n=1;P=n*R*T/V;formula='P₁/T₁ = P₂/T₂';constant='Volume and amount fixed'}if(law==='avogadro'){P=101.325;T=298.15;V=n*R*T/P;formula='V₁/n₁ = V₂/n₂';constant='Pressure and temperature fixed'}if(law==='ideal'){V=n*R*T/P;constant='Ideal gas equation'}return {law,R,T,n,V,P,formula,constant}}

const liquidReceiverTypes=new Set(['testtube','boilingTube','beaker','erlenmeyer','roundBottom','flatBottom','volumetricFlask','cylinder','burette','volumetricPipette','graduatedPipette','dropper','washBottle']);
const solidSampleTypes=new Set(['testtube','boilingTube','beaker','erlenmeyer','watchGlass','evaporatingDish','crucible']);
function acceptsLiquid(type){return liquidReceiverTypes.has(type)}
function acceptsLiquidDestination(type){return acceptsLiquid(type)||type==='separatoryFunnel'||type==='glassFunnel'}
function acceptsCollectionVessel(type){return ['testtube','boilingTube','beaker','erlenmeyer','roundBottom','flatBottom','cylinder'].includes(type)}

function paperSolutionPH(sample){
  const contents=sample?.contents||[];
  if(!sample?.mixed&&contents.length>1)return {reason:'Mix the staged contents before testing the solution.'};
  if(contents.some(item=>item.type==='publicationCustom'||(item.mass>0&&!item.solidDissolved)))
    return {reason:'The paper response is unmodelled for this sample.'};
  const entries=benchEntries(contents);
  if(!entries.some(entry=>entry.volume>0))return {reason:'Select an aqueous liquid sample.'};
  const hasAcid=entries.some(entry=>entry.type==='acid'&&entry.n>0);
  const hasCarbonate=entries.some(entry=>['carbonate','bicarbonate'].includes(entry.type)&&entry.n>0);
  if(hasAcid&&hasCarbonate)
    return {reason:'The final pH after carbon dioxide escapes is outside the paper model.'};
  // Sodium and potassium chloride contribute liquid volume but no net charge.
  const aqueous=entries.map(entry=>['NaCl','KCl'].includes(entry.f)&&Number.isFinite(entry.c)&&entry.c>=0&&entry.c<=1
    ? {...entry,type:'water'}
    : entry);
  const pH=foodCabbagePH(aqueous);
  return Number.isFinite(pH)?{pH}:{reason:'The paper response is unmodelled for this composition or concentration.'};
}
function freshPaperColor(paper){

function indicatorResult(paper,sample,kind,gas){

function bindThermometerPlacement(canvas){
  const button=document.getElementById('placeThermometer');
  const status=document.getElementById('heatStatus');
  button.onclick=()=>{
    if(canvas.dataset.placeThermometer){
      delete canvas.dataset.placeThermometer;
      button.textContent='Move thermometer';
      status.textContent='Thermometer placement cancelled.';
      return;
    }
    const selected=selectedEquipment();
    const thermometer=selected?.type==='thermometer'?selected:apparatus.findLast(item=>item.type==='thermometer');
    if(!thermometer){
      status.textContent='Add a thermometer from the Distillation drawer or add a heating setup.';
      return;
    }
    canvas.dataset.placeThermometer=thermometer.id;
    button.textContent='Cancel thermometer placement';
    status.textContent='Click or tap the spot on the bench where you want the thermometer.';
  };
  canvas.addEventListener('pointerdown',event=>{
    const id=canvas.dataset.placeThermometer;
    if(!id||event.button!==0)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    delete canvas.dataset.placeThermometer;
    button.textContent='Move thermometer';
    const thermometer=apparatus.find(item=>item.id===id);
    const node=canvas.querySelector('[data-type="thermometer"][data-app="'+CSS.escape(id)+'"]');
    if(!thermometer||!node)return;
    const bounds=canvas.getBoundingClientRect();
    const x=event.clientX-bounds.left-node.offsetWidth/2;
    const y=event.clientY-bounds.top-node.offsetHeight/2;
    thermometer.x=100*Math.max(0,Math.min(x,bounds.width-node.offsetWidth))/bounds.width;
    thermometer.y=100*Math.max(0,Math.min(y,bounds.height-node.offsetHeight))/bounds.height;
    selectedApp=id;
    redrawBench();
    persistWorkspace();
    status.textContent='Thermometer moved. Drag it to adjust its position.';
  },true);
}

function bindGravimetric(){let t=$('[data-grav-tare]');if(t)t.onclick=()=>{let value=Number($('#gravTareInput')?.value);if(!(value>0))return;gravimetricState.tareMass=value;gravimetricState.tareSet=true;render()};let c=$('[data-grav-collect]');if(c)c.onclick=()=>{if(!gravimetricState.tareSet||!gravimetricSample?.model.available)return;gravimetricState.collected=true;gravimetricState.wetWater=Math.max(.02,Math.min(1,gravimetricSample.totalVolume*.02));render()};let tempInput=$('#gravTempInput');if(tempInput)tempInput.onchange=()=>{gravimetricState.temperature=Math.max(25,Math.min(180,Number(tempInput.value)||105));render()};let heat=$('[data-grav-heat]');if(heat)heat.onclick=()=>{let profile=gravimetricProfile(gravimetricSample.product),temp=Math.max(25,Math.min(180,Number($('#gravTempInput')?.value)||105)),minutes=Math.max(5,Math.min(120,Number($('#gravHeatInput')?.value)||30));gravimetricState.temperature=temp;if(temp>profile.maxSafe){let status=$('#gravTempStatus');if(status)status.textContent=`${temp} °C is above the recommended model limit for ${gravimetricSample.model.formula||'this precipitate'} (${profile.maxSafe} °C). Lower the setting to avoid changing the weighed form.`;return}gravimetricState.heatMinutes+=minutes;gravimetricState.heatSessions.push({temperature:temp,minutes});gravimetricState.heating=true;gravimetricState.cooled=false;gravimetricState.finalMass=null;render();setTimeout(()=>{gravimetricState.heating=false;render()},1100)};let cool=$('[data-grav-cool]');if(cool)cool.onclick=()=>{gravimetricState.cooled=true;render()};let weigh=$('[data-grav-weigh]');if(weigh)weigh.onclick=()=>{if(!gravimetricState.cooled)return;let residue=gravimetricSample.model.mass+gravimetricResidualWater();gravimetricState.finalMass=gravimetricState.tareMass+residue;render()};let back=$('[data-grav-back]');if(back)back.onclick=()=>go('bench')}

function acidBaseClass(value){let text=String(value||'').toLowerCase().replace(/[₀₁₂₃₄₅₆₇₈₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x));if(/\b(acid|hcl|h2so4|hno3|h3po4|ch3cooh|ethanoic|acetic|hydrochloric|sulfuric|nitric)\b/.test(text))return 'acid';if(/\b(base|alkali|naoh|koh|ca\(oh\)2|lioh|ba\(oh\)2|nh3|ammonia|hydroxide|carbonate|bicarbonate)\b/.test(text))return 'base';return 'unknown'}

function simpleTitrate(){tsInit();const locked=titration.simpleCreated,started=titration.volume>0||titration.done;let full=advancedTitrate(),start=full.indexOf('<div class="titration-visual-panel">'),end=full.indexOf('<div class="workspace">',start),rig=start>=0&&end>start?full.slice(start,end):'';return `${head('SIMPLE TITRATION','Create. Titrate. Get your result.','Create a sample, add a solution of known concentration, and calculate the unknown concentration.')}<div class="simple-toolbar"><span class="pill">1:1 acid–base reaction</span><button class="btn secondary small" data-ts-view="advanced">Advanced titration</button></div><div class="simple-titration"><section class="panel simple-step"><span class="eyebrow">STEP 1</span><h2>Create your unknown</h2><div class="simple-fields"><label>Unknown chemical<select id="simpleChemical" ${locked?'disabled':''}><option value="acid" ${titration.simpleChemical!=='base'?'selected':''}>Hydrochloric acid (HCl)</option><option value="base" ${titration.simpleChemical==='base'?'selected':''}>Sodium hydroxide (NaOH)</option></select></label><label>Concentration to create (mol/L)<input id="analyteC" type="number" min="0" step="any" value="${titration.analyteConc??''}" placeholder="e.g. 0.125" ${locked?'disabled':''}></label><label>Sample volume (mL)<input id="sampleVol" type="number" min="0" step="any" value="${titration.sampleVol}" ${locked?'disabled':''}></label></div><div class="ch-actions"><button class="btn" id="simpleCreate" ${locked?'disabled':''}>${locked?'✓ Unknown created':'Create unknown'}</button>${locked?'<button class="btn secondary" id="simpleNew">Create a new unknown</button>':''}</div></section><section class="panel simple-step"><span class="eyebrow">STEP 2</span><h2>Titrate with a known solution</h2><div class="simple-fields"><label>Known solution<input value="${esc(titration.knownChemical)}" readonly></label><label>Known concentration (mol/L)<input id="titrantC" type="number" min="0" step="any" value="${titration.titrantC}" ${started?'disabled':''}></label><label>Volume to add each time (mL)<input id="step" type="number" min="0" step="any" value="${titration.deliveryStep??.5}" ${titration.done?'disabled':''}></label></div><div class="ch-actions"><button class="btn" id="simpleAdd" ${!locked||titration.done?'disabled':''}>Add titrant</button><button class="btn soft" id="simpleAuto" ${!locked||titration.done?'disabled':''}>Titrate automatically</button><button class="btn secondary" id="simpleRepeat" ${!locked?'disabled':''}>Repeat titration</button></div><div class="notice" role="status" aria-live="polite" id="simpleStatus">${esc(titration.simpleMessage||'Create your unknown first.')}</div>${rig}<p class="muted">The colour changes at the ideal endpoint. Automatic titration stops exactly there. If you add too much manually, repeat with smaller additions.</p></section><section class="panel simple-step"><span class="eyebrow">STEP 3</span><h2>Get the result</h2><button class="btn" id="simpleGetResult" ${!locked||titration.done||!ttPositive(titration.volume)?'disabled':''}>Get result</button>${tsResultHtml()}</section><p class="muted">Simple mode uses HCl + NaOH → NaCl + H₂O (1:1), with ideal endpoint behaviour. Use Advanced titration for other reactions, mole ratios, mass-based preparation or experimental readings.</p></div>`}
function titrate(){if(titration.simpleMode!==false&&titration.advancedBackup)titration={...tsCopy(titration.advancedBackup),simpleMode:false};titration.simpleMode=false;return advancedTitrate()}
function bindSimpleTitration(){const chemical=$('#simpleChemical');if(chemical)chemical.onchange=()=>{captureTitrationSetup();titration.simpleChemical=chemical.value;tsChemical();render()};for(const id of ['analyteC','sampleVol','titrantC','step']){let el=$('#'+id);if(el)el.oninput=()=>{captureTitrationSetup();if(id==='titrantC'&&titration.simpleCreated&&!ttPositive(titration.titrantC))tsMessage('Enter a positive known concentration before titrating.')}}$('#simpleCreate').onclick=tsCreate;let newSample=$('#simpleNew');if(newSample)newSample.onclick=()=>tsReset(true);$('#simpleAdd').onclick=tsAdd;$('#simpleAuto').onclick=tsAuto;$('#simpleRepeat').onclick=()=>tsReset(false);$('#simpleGetResult').onclick=tsResult;tsBindView()}
function tsBindView(){$$('[data-ts-view]').forEach(b=>b.onclick=()=>tsView(b.dataset.tsView))}

function ttUsesLiquid(){return titration.prepMethod==='stock'||titration.prepMethod==='liquid'}
function ttLiquidPreparation(){const t=titration,stock=t.prepMethod==='stock';if(!ttUsesLiquid())return {valid:false,message:'Choose a liquid preparation method.'};const required=stock?['stockC','stockVolume','preparedVolume']:['reagentVolume','density','purity','preparedVolume'];if(required.some(k=>!ttPositive(t[k])))return {valid:false,message:stock?'Enter positive stock concentration, volume transferred, and final solution volume.':'Enter positive liquid volume, density, purity, molar mass, and final solution volume.'};if(!stock&&Number(t.purity)>100)return {valid:false,message:'Purity must be greater than 0 and no more than 100% by mass.'};const volume=Number(stock?t.stockVolume:t.reagentVolume),final=Number(t.preparedVolume);if(volume>final)return {valid:false,message:'For this dilution, the volume transferred cannot exceed the final solution volume.'};if(ttPositive(t.sampleVol)&&Number(t.sampleVol)>final)return {valid:false,message:'The aliquot volume cannot exceed the total prepared solution volume.'};if(!stock&&!ttMolarMassInfo())return {valid:false,message:'Enter the solute formula or its molar mass in g/mol.'};const molar=stock?null:ttMolarMassInfo().mass;const soluteMass=stock?null:Number(t.reagentVolume)*Number(t.density)*Number(t.purity)/100,moles=stock?Number(t.stockC)*Number(t.stockVolume)/1000:soluteMass/molar,concentration=moles/(final/1000);if(!ttPositive(concentration))return {valid:false,message:'The preparation is outside the supported numeric range. Check the quantities and units.'};return {valid:true,concentration,moles,soluteMass,summary:stock?`Stock dilution: ${ttFmt(Number(t.stockC))} mol/L × ${ttFmt(volume)} mL ÷ ${ttFmt(final)} mL = ${ttFmt(concentration)} mol/L. Transfer the stock, then make up to the final volume.`:`Liquid preparation: ${ttFmt(volume)} mL × ${ttFmt(Number(t.density))} g/mL × ${ttFmt(Number(t.purity))}% / 100 = ${ttFmt(soluteMass)} g solute; ÷ ${ttFmt(molar)} g/mol ÷ (${ttFmt(final)} / 1000) L = ${ttFmt(concentration)} mol/L.`}}
function ttLiquidMethod(){return `<div class="field" style="margin:12px 0"><label for="prepMethod">PREPARATION METHOD</label><select id="prepMethod"><option value="standard" ${!ttUsesLiquid()?'selected':''}>Dissolve a weighed solid</option><option value="stock" ${titration.prepMethod==='stock'?'selected':''}>Liquid solution · dilute a stock</option><option value="liquid" ${titration.prepMethod==='liquid'?'selected':''}>Liquid reagent · volume, density &amp; purity</option></select></div>`}
function ttLiquidFields(){if(!ttUsesLiquid())return '';const stock=titration.prepMethod==='stock';return `<section class="notice" style="margin:14px 0;padding:16px"><h3 style="margin:0 0 12px">${stock?'Prepare by stock dilution':'Prepare from a measured liquid reagent'}</h3><div class="titration-setup-grid">${stock?`<div class="field"><label for="stockC">STOCK CONCENTRATION (mol/L)</label><input id="stockC" type="number" min="0" step="any" value="${titration.stockC??''}" placeholder="e.g. 1.00"></div><div class="field"><label for="stockVolume">VOLUME OF STOCK TRANSFERRED (mL)</label><input id="stockVolume" type="number" min="0" step="any" value="${titration.stockVolume??''}" placeholder="e.g. 10.00"></div>`:`<div class="field"><label for="reagentVolume">LIQUID REAGENT MEASURED (mL)</label><input id="reagentVolume" type="number" min="0" step="any" value="${titration.reagentVolume??''}"></div><div class="field"><label for="density">DENSITY OF LIQUID REAGENT (g/mL)</label><input id="density" type="number" min="0" step="any" value="${titration.density??''}"></div><div class="field"><label for="purity">SOLUTE PURITY (% w/w)</label><input id="purity" type="number" min="0" max="100" step="any" value="${titration.purity??100}"></div>`}</div><p>Use the <b>final prepared solution volume</b> and <b>aliquot titrated</b> fields above. Measure the liquid, transfer it to the volumetric flask, and make up to the final mark. The final volume is not the volume of solvent added.</p><p>${stock?'Cprepared = Cstock × Vtransferred / Vfinal. Both volumes are in mL.':'For a pure liquid use 100% purity. For a concentrated solution use its actual solute mass percentage, the solution density and the solute molar mass (including hydration where applicable). Cprepared = (Vliquid × density × purity/100 / molar mass) / (Vfinal/1000).'}</p><div id="liquidPreparationSummary" role="status">${ttLiquidSummary()}</div></section>`}
function ttLiquidSummary(){const p=ttLiquidPreparation();return p.valid?`<b>${esc(p.summary)}</b>`:esc(p.message)}
function ttBindLiquid(){const select=$('#prepMethod');if(select)select.onchange=()=>{captureTitrationSetup();titration.prepMethod=select.value;render();updateTitrationStatus()};for(const id of ['stockC','stockVolume','reagentVolume','density','purity']){const el=$('#'+id);if(el)el.oninput=el.onchange=updateTitrationStatus}}

function ttColourFrom(target){let previous=titration._lastLiquidColour||target;if(typeof document!=='undefined'&&typeof getComputedStyle==='function'){const stop=document.querySelector('#sampleLiquid [data-titration-colour]');if(stop){const value=getComputedStyle(stop).stopColor;if(/^#[0-9a-f]{6}$/i.test(value))previous=value;else{const rgb=value.match(/^rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/i);if(rgb)previous='#'+rgb.slice(1,4).map(v=>Math.max(0,Math.min(255,Math.round(Number(v)))).toString(16).padStart(2,'0')).join('')}}}titration._lastLiquidColour=target;return previous}
function ttColourFade(from,to){if(from===to)return '';const duration=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches?'0.01s':'2.4s';return '<animate attributeName="stop-color" from="'+from+'" to="'+to+'" dur="'+duration+'" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" fill="freeze"/>'}
function ttFormulaMass(value){const weights={H:1.008,B:10.81,C:12.011,N:14.007,O:15.999,F:18.998,Na:22.98977,Mg:24.305,Al:26.98154,Si:28.085,P:30.97376,S:32.06,Cl:35.45,K:39.0983,Ca:40.078,Cr:51.9961,Mn:54.938,Fe:55.845,Co:58.933,Ni:58.693,Cu:63.546,Zn:65.38,Br:79.904,Ag:107.8682,I:126.90447,Ba:137.327,Pb:207.2};const names={'sodium hydroxide':'NaOH','potassium hydroxide':'KOH','hydrochloric acid':'HCl','hydrogen chloride':'HCl','sulfuric acid':'H2SO4','sulphuric acid':'H2SO4','nitric acid':'HNO3','sodium chloride':'NaCl','sodium carbonate':'Na2CO3','sodium carbonate anhydrous':'Na2CO3','sodium bicarbonate':'NaHCO3','sodium hydrogen carbonate':'NaHCO3','calcium carbonate':'CaCO3','oxalic acid':'H2C2O4','oxalic acid dihydrate':'H2C2O4·2H2O','glucose':'C6H12O6'};let formula=String(value||'').trim().replace(/^unknown\s+/i,'');formula=names[formula.toLowerCase()]||formula;formula=formula.replace(/[₀₁₂₃₄₅₆₇₈₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x));if(!/^[A-Za-z0-9()[\].·]+$/.test(formula))return null;let total=0;for(let part of formula.split(/[.·]/)){if(!part)return null;let coefficient=1,leading=part.match(/^([0-9]+)(?=[A-Z(\[])/);if(leading){coefficient=Number(leading[1]);part=part.slice(leading[1].length)}let tokens=part.match(/[A-Z][a-z]?|[0-9]+|[()[\]]/g);if(!tokens||tokens.join('')!==part||!ttPositive(coefficient))return null;let i=0;function count(){if(i<tokens.length&&/^\d+$/.test(tokens[i]))return Number(tokens[i++]);return 1}function group(close){let sum=0;while(i<tokens.length){let token=tokens[i++];if(token===')'||token===']'){if(token!==close)throw Error('Grouping');return sum}if(token==='('||token==='['){const inner=group(token==='('?')':']');if(!ttPositive(inner))throw Error('Empty group');let n=count();if(!ttPositive(n))throw Error('Count');sum+=inner*n}else{if(weights[token]===undefined)throw Error('Element');let n=count();if(!ttPositive(n))throw Error('Count');sum+=weights[token]*n}}if(close)throw Error('Unclosed group');return sum}try{const mass=group(null);if(!ttPositive(mass))return null;total+=coefficient*mass}catch{return null}}return ttPositive(total)?{mass:total,formula}:null}
function ttMolarMassInfo(){if(titration.molarMass!==''&&titration.molarMass!==undefined&&titration.molarMass!==null)return ttPositive(titration.molarMass)?{mass:Number(titration.molarMass),source:'entered'}:null;const inferred=ttFormulaMass(titration.unknownSpecies);return inferred?{...inferred,source:'estimated'}:null}
function ttSolidPreparation(){const t=titration;if(!ttPositive(t.soluteMass))return {valid:false,message:'Enter the mass of pure solid dissolved, in grams.'};const molar=ttMolarMassInfo();if(!molar)return {valid:false,message:'Enter a chemical formula (including any water of crystallisation), or provide its molar mass in g/mol.'};if(!ttPositive(t.preparedVolume))return {valid:false,message:'Enter the solution volume in mL. Select whether this is final solution volume or solvent volume only.'};if(ttPositive(t.sampleVol)&&Number(t.sampleVol)>Number(t.preparedVolume))return {valid:false,message:'The aliquot cannot exceed the prepared sample volume.'};const moles=Number(t.soluteMass)/molar.mass,concentration=moles/(Number(t.preparedVolume)/1000);if(!ttPositive(concentration))return {valid:false,message:'The preparation is outside the supported numeric range. Check the units.'};const estimated=t.volumeBasis==='solvent';return {valid:true,moles,concentration,molarMass:molar.mass,estimated,summary:`${estimated?'Approximate prediction (assumes final volume equals solvent volume added). ':''}Molar mass: ${ttFmt(molar.mass)} g/mol${molar.source==='estimated'?' (estimated from '+molar.formula+'; specify any hydrate and override if needed)':''}. Moles = ${ttFmt(Number(t.soluteMass))} / ${ttFmt(molar.mass)} = ${ttFmt(moles)} mol. Concentration = ${ttFmt(moles)} / (${ttFmt(Number(t.preparedVolume))} / 1000) = ${ttFmt(concentration)} mol/L.`}}
function ttPreparationInfo(){if(titration.benchSession&&typeof benchTitCapture==='function'){return benchTitPreparation();}return ttUsesLiquid()?ttLiquidPreparation():ttSolidPreparation()}
function ttPreparationSummary(){const p=ttPreparationInfo();return `<div class="notice" id="preparationPrediction" role="status" style="margin:14px 0">${esc(p.valid?p.summary:p.message)}</div>`}
function ttVolumeBasis(){return ttUsesLiquid()?'':`<div class="field" style="margin:10px 0"><label for="volumeBasis">VOLUME ENTERED BELOW IS</label><select id="volumeBasis"><option value="final" ${titration.volumeBasis!=='solvent'?'selected':''}>Final solution volume after dissolving (preferred)</option><option value="solvent" ${titration.volumeBasis==='solvent'?'selected':''}>Solvent added only (approximate concentration)</option></select></div>`}
function ttBindPreparation(){const basis=$('#volumeBasis');if(basis)basis.onchange=()=>{captureTitrationSetup();titration.volumeBasis=basis.value;render();updateTitrationStatus()}}

function ttSmooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function ttStrongType(name){let n=String(name||'').toLowerCase().replace(/^unknown\s+/,'').replace(/[₀₁₂₃₄₅₆₇₈₉]/g,x=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(x)).trim();if(['hcl','hydrochloric acid','hydrogen chloride','hno3','nitric acid'].includes(n))return 1;if(['naoh','sodium hydroxide','koh','potassium hydroxide'].includes(n))return -1;return 0}
function ttStrongPH(){if(titration.kind!=='acid'||titration.mode==='manual'||!ttValid(titration)||Number(titration.analyteCoeff)!==Number(titration.titrantCoeff))return null;const a=ttStrongType(titration.unknownSpecies),b=ttStrongType(titration.knownChemical),c=ttTrueConcentration();if(!a||a===b||!b||!ttPositive(c))return null;let water=0;for(const r of titration.unknownAdditions||[]){if(r.kind==='indicator')continue;if(r.unit==='mL'&&/^(distilled |deionised |deionized )?water$/i.test(r.name))water+=Number(r.amount)||0;else return null}const va=Number(titration.sampleVol)/1000,vt=Number(titration.volume)/1000,total=va+vt+water/1000;if(!ttPositive(total))return null;const charge=(a*c*va+b*Number(titration.titrantC)*vt)/total,root=Math.hypot(charge,2e-7),h=charge>=0?(charge+root)/2:2e-14/(root-charge);return Number.isFinite(h)&&h>0?-Math.log10(h):null}
function ttVolumeColour(name,profile,guide){const v=Number(titration.volume)||0,ratio=guide?v/guide:0,ph=ttStrongPH(),key=String(name).toLowerCase();let kind=key.includes('phenolphthalein')?'phenol':key.includes('methyl orange')?'orange':key.includes('bromothymol')?'bromo':null;let fraction,color,phase,model='illustrative',plume=profile.end;if(ph!==null&&kind){model='strong-pH';let raw;if(kind==='phenol'){raw=ttSmooth((ph-8.3)/1.7);color=mixHex('#f7faf8','#e875ad',raw);plume=ttStrongType(titration.knownChemical)<0?'#e875ad':'#f7faf8'}else if(kind==='orange'){raw=ttSmooth((ph-3.1)/1.3);color=mixHex('#db514b','#e8ce48',raw);plume=ttStrongType(titration.knownChemical)<0?'#e8ce48':'#db514b'}else{raw=ttSmooth((ph-6)/1.6);color=ph<=7?mixHex('#e3ce49','#4dbb78',ttSmooth(ph-6)):mixHex('#4dbb78','#3979c4',ttSmooth((ph-7)/.6));plume=ttStrongType(titration.knownChemical)<0?'#3979c4':'#e3ce49'}fraction=ttStrongType(titration.unknownSpecies)>0?raw:1-raw;phase=ratio<.9?'Before endpoint':ratio<1-1e-10?'Approaching endpoint · reduce the addition volume':ratio<=1+1e-10?'Equivalence volume · observe the indicator':ratio<1.002?'Near endpoint · watch for persistent colour':'Excess titrant · final colour is becoming stronger';if(kind==='phenol'&&ttStrongType(titration.unknownSpecies)>0&&raw>0&&raw<.18)phase='Very faint persistent pink · stop adding and observe';if(kind==='phenol'&&ttStrongType(titration.unknownSpecies)>0&&raw>.55&&ratio>1)phase='Pink is becoming strong · excess titrant';if(kind==='phenol'&&ttStrongType(titration.unknownSpecies)<0&&raw<.02&&ratio>.995&&ratio<1.002)phase='Pink has just disappeared · stop adding and observe'}else{fraction=guide?ratio<=.97?0:ratio<=1?.25*ttSmooth((ratio-.97)/.03):.25+.75*ttSmooth((ratio-1)/.03):0;color=mixHex(profile.start,profile.end,fraction);phase=!guide?'Prepare the sample to simulate a colour change':ratio<.97?'Before endpoint':ratio<1-1e-10?'Approaching endpoint · faint change is not yet the final cue':ratio<=1.001?'Faint endpoint colour · stop and observe':'Past endpoint · excess titrant';if(titration.mode==='manual')phase='Manual readings · no simulated endpoint'}return {color,fraction,label:phase+(ph!==null&&kind?' · pH ≈ '+ph.toFixed(2):' · illustrative cue'),ph:model==='strong-pH'?ph:null,colourModel:model,plumeColor:plume,guide}}
function ttMixingPlume(indicator,y){if(!titration._mixingPending)return '';titration._mixingPending=false;if(!indicator.guide||titration.volume<=0||titration.volume>=indicator.guide||indicator.colourModel!=='strong-pH')return '';const ratio=titration.volume/indicator.guide,duration=.6+2.1*Math.pow(Math.max(0,Math.min(1,ratio)),5);if(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches)return '';return `<g clip-path="url(#flaskClip)" pointer-events="none"><ellipse cx="234" cy="${y+8}" rx="27" ry="10" fill="${indicator.plumeColor}" opacity="0"><animate attributeName="opacity" values="0;.65;0" keyTimes="0;.15;1" dur="${duration.toFixed(2)}s" fill="freeze"/><animate attributeName="rx" values="8;35;45" dur="${duration.toFixed(2)}s" fill="freeze"/></ellipse></g>`}
function ttLearningCue(indicator){if(titration.benchSession)return '<div class="notice"><b>Control the endpoint</b><p>Reduce the addition as the indicator changes. Allow each addition to mix and observe the lasting colour. The calculation uses your recorded titre.</p><div class="ch-actions">'+[.1,.01,.001].map(v=>'<button class="btn secondary small" type="button" data-tt-fine="'+v+'">Set addition to '+v+' mL</button>').join('')+'</div><p>Strong acid/base colours use ideal pH; weak-acid and carbonate transitions are illustrative.</p></div>';const forward=ttStrongType(titration.unknownSpecies)>0,phenol=(indicator.name||'').toLowerCase().includes('phenolphthalein');let guidance=phenol?(forward?'Brief pink swirls that fade after mixing are not a lasting endpoint. Look for the first very faint pink that remains; a stronger pink means more excess titrant.':'The pink becomes paler as acid is added. Stop when it has just disappeared after mixing.'): 'Watch the gradual change through the selected indicator colours. Slow down near the transition and allow each addition to mix before deciding to stop.';return `<div class="notice" style="margin-top:12px"><b>Practise controlling the endpoint</b><p>${guidance} Use smaller volumes as the change becomes more noticeable.</p><div class="ch-actions">${[.1,.01,.001].map(v=>`<button class="btn secondary small" type="button" data-tt-fine="${v}">Set addition to ${v} mL</button>`).join('')}</div><p class="muted">${indicator.colourModel==='strong-pH'?'Colour follows an ideal 25 °C strong-acid/strong-base pH calculation for this chemical pair. Indicator colour changes over a pH range, so the visual endpoint can differ slightly from exact equivalence.':'This reaction uses a gradual illustrative colour cue around the calculated equivalence volume; it is not a full equilibrium model.'} The reported concentration always uses the volume you record. <a href="https://openstax.org/books/chemistry-2e/pages/14-7-acid-base-titrations" target="_blank" rel="noopener">Indicator and titration background</a></p></div>`}
function ttBindFine(){$$('[data-tt-fine]').forEach(b=>b.onclick=()=>{let step=$('#step');titration.deliveryStep=Number(b.dataset.ttFine);if(step)step.value=titration.deliveryStep;persistWorkspace()})}

titration={...freshTitration(titration.kind),...titration};
restoreWorkspace();
registerFoodReagents();registerDemoReagents();
