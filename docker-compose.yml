services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simlab}
      POSTGRES_USER: ${POSTGRES_USER:-simlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: Postgres is only reachable from other containers.

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-simlab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simlab}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # WhatsApp (OpenWA). Off until deploy/whatsapp-setup.sh enables the "whatsapp" profile.
  # No "ports:" on purpose: only the api container reaches it, over the Docker network.
  whatsapp:
    profiles: ["whatsapp"]
    image: openwa/wa-automate:latest
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      W_A_V: ${WA_VERSION:-5.1.0}
      WA_PORT: 8080
      WA_HOST: 0.0.0.0
      WA_SESSION_ID: simlab
      WA_USER_DATA_DIR: /sessions/simlab
      WA_API_KEY: ${WA_API_KEY:-}
    command: ["--session-id", "simlab", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - wa_sessions:/sessions

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  wa_sessions:
  caddy_data:
  caddy_config:
